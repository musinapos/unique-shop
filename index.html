<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNIQUE - POS</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#E8F5F5;color:#111;padding-top:175px}
/* PROFESSIONAL SHINE - SLOW ONLY ON TOP */
@keyframes proShine{0%{left:-30%;opacity:0}5%{opacity:1}15%{left:110%;opacity:1}20%,100%{left:110%;opacity:0}}
.top{position:fixed;top:0;left:0;right:0;z-index:30;background:linear-gradient(90deg,rgba(0,102,102,.97) 0%,rgba(0,163,163,.97) 50%,rgba(212,175,55,.97) 100%);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.3);overflow:hidden}
.top::after{content:"";position:absolute;top:0;bottom:0;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:proShine 12s infinite;transform:skewX(-20deg)}
/* THICK BUTTONS LIKE LOGIN - BIG, BOLD */
button{position:relative;padding:22px 18px;border:none;border-radius:18px;font-weight:900;font-size:19px;cursor:pointer;background:linear-gradient(180deg,#00D0D0,#006666);color:#fff;box-shadow:0 8px 0 #004444,0 10px 16px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.6);border:4px solid #004444}
button:active{transform:translateY(6px);box-shadow:0 2px 0 #004444}
input,select{padding:16px;border:3px solid #006666;border-radius:14px;font-weight:700;width:100%;background:rgba(255,255,255,.95);font-size:16px}
.scanbar{position:fixed;top:95px;left:0;right:0;z-index:29;background:rgba(255,255,255,.97);padding:12px;display:flex;gap:10px;border-bottom:4px solid #006666;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.scanbar input{flex:2}.scanbar button{flex:1;background:linear-gradient(180deg,#F5E6B8,#D4AF37);color:#2B1D00;border-color:#8A6D1B;box-shadow:0 8px 0 #8A6D1B,0 10px 16px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.7)}
.wrap{display:flex;gap:14px;padding:14px;max-width:1300px;margin:0 auto}
.left{flex:1.9}.right{flex:1;min-width:340px}
.cats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.catbtn{position:relative;background:linear-gradient(180deg,#fff,#D6F0F0);color:#006666;font-size:19px;padding:16px;border:5px solid #006666;border-radius:20px;box-shadow:0 8px 0 #004444,0 10px 18px rgba(0,0,0,.2);display:flex;flex-direction:column}
.catbtn:nth-child(3n){background:linear-gradient(180deg,#fff,#FFF8D6)}
.catbtn:nth-child(3n+1){background:linear-gradient(180deg,#fff,#D6F0F0)}
.catbtn:nth-child(3n+2){background:linear-gradient(180deg,#fff,#FFF3C4);border-color:#B8962E}
.catbtn .cimg{height:110px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;border:3px solid #006666}
.catbtn small{display:block;font-size:12px;color:#666;margin-top:6px}
.backbtn{background:linear-gradient(180deg,#FFF8D6,#E8C97A)!important;color:#2B1D00!important;border-color:#8A6D1B!important;width:100%;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{position:relative;background:linear-gradient(180deg,#fff,#D6F0F0);border:5px solid #006666;border-radius:22px;box-shadow:0 8px 0 #004444,0 12px 20px rgba(0,0,0,.22);display:flex;flex-direction:column}
.card:nth-child(3n){background:linear-gradient(180deg,#fff,#FFF8D6)}
.card:nth-child(3n+1){background:linear-gradient(180deg,#fff,#D6F0F0)}
.card:nth-child(3n+2){background:linear-gradient(180deg,#fff,#FFF3C4);border-color:#B8962E}
.pic{height:150px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px;border-bottom:3px solid #006666;position:relative;z-index:2}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.card-body{padding:14px;flex:1;display:flex;flex-direction:column;position:relative;z-index:2}.card b{font-size:16px;color:#006666}.price{color:#008080;font-size:24px;font-weight:900}.low{color:red;font-weight:900;background:#ffe0e0;padding:2px 6px;border-radius:6px}
.card button{width:100%;margin-top:auto;background:linear-gradient(180deg,#F5E6B8,#D4AF37);color:#2B1D00;border-color:#8A6D1B;box-shadow:0 8px 0 #8A6D1B,0 10px 16px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.7)}
.cart{position:relative;background:#FFFEF5;border:5px solid #006666;border-radius:20px;padding:14px;position:sticky;top:170px;box-shadow:0 8px 0 #004444,0 12px 20px rgba(0,0,0,.2)}
.row{display:flex;justify-content:space-between;gap:6px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px;align-items:center}
.row button{width:auto;padding:8px 12px;margin:0}
.row img{width:40px;height:40px;object-fit:contain;border-radius:6px;background:#fff}
.total{font-size:28px;font-weight:900;display:flex;justify-content:space-between;color:#006666}
.paybtn{width:100%;padding:24px;font-size:22px}
.drawerbtn{width:100%;background:linear-gradient(180deg,#FFF8D6,#E8C97A)!important;color:#2B1D00!important;border-color:#8A6D1B!important;margin-top:10px}
#login{position:fixed;inset:0;background:linear-gradient(180deg,#006666 0%,#00A3A3 55%,#D4AF37 100%);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.loginBox{position:relative;background:rgba(255,255,255,.95);width:420px;max-width:95vw;padding:24px;border-radius:24px;text-align:center;box-shadow:0 10px 0 #004444; border:5px solid #006666}
.loginBox input{margin:8px 0}
#mgmt,#receipt{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}
.paper{background:#fff;width:520px;max-height:92vh;overflow:auto;padding:16px;border-radius:16px}
.paper table{width:100%;border-collapse:collapse;font-size:12px}.paper td,.paper th{border:1px solid #eee;padding:5px}
.lowbox{background:#ffe0e0;border:3px solid red;border-radius:12px;padding:10px;margin:8px 0}
.matchbox{background:#d4ffd4;border:3px solid green;border-radius:12px;padding:12px;margin:8px 0;text-align:center}
.shortbox{background:#ffe0e0;border:3px solid red;border-radius:12px;padding:12px;margin:8px 0;text-align:center}
@media(max-width:850px){.wrap{flex-direction:column}.cart{position:static}.cats,.grid{grid-template-columns:1fr 1fr}.top h1{font-size:22px}.top{padding:6px}.scanbar{top:82px}body{padding-top:155px}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0;display:block!important;background:#fff;padding:20px} #login{display:none!important}}
</style></head><body>
<div id="printArea" style="display:none"></div>
<div id="loading" style="position:fixed;inset:0;background:linear-gradient(180deg,#006666,#00A3A3,#D4AF37);display:none;align-items:center;justify-content:center;z-index:1000;flex-direction:column;color:#fff"><h2 style="letter-spacing:5px">UNIQUE</h2><p style="font-weight:900">Loading Shop...</p><p style="font-size:40px">⏳</p></div>
<div id="login"><div class="loginBox"><img src="unique.logo.jpg" style="width:150px;height:150px;object-fit:cover;border-radius:50%" onerror="this.style.display='none'"><h1 style="color:#006666;letter-spacing:5px">UNIQUE</h1><p style="font-weight:900">BEAUTY & FASHION<br>🇿🇦 SOUTH AFRICA</p><hr><p style="font-weight:900">STAFF LOGIN</p><input id="staffName" placeholder="Staff Name"><input id="loginPin" type="password" placeholder="Enter PIN" onkeydown="if(event.key==='Enter')doLogin()"><button onclick="doLogin()" style="width:100%">LOGIN TO POS</button></div></div>
<div class="top"><div style="display:flex;gap:8px;align-items:center"><img src="unique.logo.jpg" style="width:60px;height:60px;border-radius:50%;object-fit:cover" onerror="this.style.display='none'"><h1>UNIQUE</h1></div><div style="text-align:right;font-weight:900"><span id="clock"></span><br><span id="staffShow" style="font-size:13px"></span><br><button onclick="openMgmt()" style="padding:10px;font-size:14px">MANAGEMENT</button> <button onclick="cashUp()" style="padding:10px;font-size:14px;background:linear-gradient(180deg,#F5E6B8,#D4AF37);color:#111;border-color:#8A6D1B">DAY END</button> <button onclick="logout()" style="padding:10px;font-size:14px;background:#c00">LOGOUT</button></div></div>
<div class="scanbar"><input id="scan" placeholder="SCAN / TYPE BARCODE + Enter" onkeydown="if(event.key==='Enter')doScan()"><button onclick="doScan()">SCAN +</button><button onclick="openDrawer()">CASH DRAWER</button></div>
<div class="wrap"><div class="left"><div id="lowBanner" style="display:none;background:#ffe0e0;border:4px solid red;border-radius:14px;padding:10px;margin-bottom:12px;font-weight:900;color:red"></div><div id="cats" class="cats"></div><button id="backBtn" class="backbtn" style="display:none" onclick="showCats()">← BACK TO ALL GROUPS</button><div id="grid" class="grid"></div></div>
<div class="right"><div class="cart"><h2 style="margin:0;text-align:center;color:#006666">CURRENT SALE</h2><p style="text-align:center;margin:4px">Order <b id="orderNo"></b> • Cashier: <b id="cashierShow"></b></p><div id="cart"></div><div class="total"><span>TOTAL</span><span id="total">R0</span></div><select id="payMethod"><option>Cash</option><option>Card</option><option>Card + Cash</option><option>EFT / Tap</option></select><input id="cashGiven" type="number" placeholder="Cash given"><div id="change" style="font-weight:900;text-align:center"></div><input id="cust" placeholder="Customer name / phone (optional)"><input id="extraNote" placeholder="Extra - if you forgot something"><button class="paybtn" onclick="checkout()">CHECKOUT & PRINT</button><button class="drawerbtn" onclick="openDrawer()">OPEN CASH DRAWER</button><button id="clearSaleBtn" onclick="tripleClearSale()" style="width:100%;background:#eee;color:#111;box-shadow:0 4px 0 #999">Clear Sale</button><button onclick="cashUp()" style="width:100%;background:linear-gradient(180deg,#F5E6B8,#D4AF37);color:#111;border-color:#8A6D1B">DAY END - CASH UP</button><p style="text-align:center;font-weight:800;color:#006666">UNIQUE - Thank You! 🇿🇦</p></div></div></div>
<div id="receipt"><div class="paper" id="paper"></div></div><div id="mgmt"><div class="paper" id="mgmtPaper"></div></div>
<script>
let BASE_ITEMS=[["ITE0001","Glasses A",80],["ITE0002","Glasses B",150],["ITE0003","Glasses C",100],["ITE0004","Glasses D",120],["ITE0005","Nail Paint A",15],["ITE0006","Nail Paint B",5],["ITE0007","Traditional Earring A",50],["ITE0008","Traditional Earring B",70],["ITE0009","Traditional Earring C",100],["ITE0010","Traditional Earring D",30],["ITE0011","Wallet A",300],["ITE0012","Wallet B",50],["ITE0013","Wallet C",100],["ITE0014","Wallet D",150],["ITE0015","Wallet E",250],["ITE0016","Fashion Earring 1",20],["ITE0017","Fashion Earring 2",30],["ITE0018","Fashion Earring 3",40],["ITE0019","Fashion Earring 4",50],["ITE0020","Knob A",10],["ITE0021","Knob B",20],["ITE0022","Watch A",50],["ITE0023","Watch B",100],["ITE0024","Watch C",150],["ITE0025","Watch D",200],["ITE0026","Watch E",250],["ITE0027","Watch F",300],["ITE0028","Watch G - Smart",600],["ITE0029","Bracelet A",40],["ITE0030","Bracelet B",60],["ITE0031","Bracelet C",80],["ITE0032","Bracelet D",25],["ITE0033","Bracelet E",100],["ITE0034","Chain A",100],["ITE0035","Chain B",80],["ITE0036","Chain C",60],["ITE0037","Chain D",50],["ITE0038","Brow Cheek 1",50],["ITE0039","Brow Cheek 2",30],["ITE0040","Crew Shed 1",70],["ITE0041","Crew Shed 2",40],["ITE0042","Crew Shed 3",80],["ITE0043","Crew Shed 4",100],["ITE0044","Wig Cap 1",20],["ITE0045","Wig Cap 2",40],["ITE0046","Durag A",50],["ITE0047","Durag B",100],["ITE0048","Needle A",10],["ITE0049","Needle B",30],["ITE0050","Sewing Thread A",5],["ITE0051","Sewing Thread B",10],["ITE0052","Sewing Thread C",15],["ITE0053","Sewing Thread D",20],["ITE0054","Shoe Sole 1",50],["ITE0055","Shoe Sole 2",70],["ITE0056","Shoe Sole 3",80],["ITE0057","Heel",20],["ITE0058","Long Sole",90],["ITE0059","Glove 1",5],["ITE0060","Glove 2",10],["ITE0061","Pantyhose 1",30],["ITE0062","Pantyhose 2",60],["ITE0063","Pantyhose 3",100],["ITE0064","Zip 1",25],["ITE0065","Zip 2",10],["ITE0066","Zip 3",20],["ITE0067","Shoe Needle 1",20],["ITE0068","Shoe Needle 2",6],["ITE0069","Shoe Needle 3",60],["ITE0070","Shoe Needle White",30],["ITE0071","Shoe Needle Black",30],["ITE0072","Machine Oil",60],["ITE0073","Pin 1",20],["ITE0074","Pin 2",25],["ITE0075","Lace Head Belt A",30],["ITE0076","Lace Head Belt B",40],["ITE0077","Reborn Colour",50],["ITE0078","Rasta Reborn",20],["ITE0079","Elastic Small",7],["ITE0080","Elastic Medium",20],["ITE0081","Reborn Lace",85],["ITE0082","Venda Reborn",10],["ITE0083","Lace Reborn",5],["ITE0084","Cutting Zip",50],["ITE0085","Ziplock",30],["ITE0086","Cap Top Pop Belt",50],["ITE0087","Flute For Music",100],["ITE0088","Fish Lane Stitch",50],["ITE0089","Fish Lane Stretch",50],["ITE0090","Fish Lane Heart",50],["ITE0091","Beat String",7],["ITE0092","Suspenders",70],["ITE0093","Short Gloves",50],["ITE0094","Long Gloves",80],["ITE0095","Parton 1",10],["ITE0096","Parton 2",6],["ITE0097","Partool",30],["ITE0098","Press Stance",30],["ITE0099","Back Lace",30],["ITE0100","Earring Hooks",20],["ITE0101","Chain Holders",20],["ITE0102","Shampoo Cap",150],["ITE0103","Socks",50],["ITE0104","Arm Cover",40],["ITE0105","Head Flower",150],["ITE0106","Wedding Needles",150],["ITE0107","Wedding Pins",20],["ITE0108","Wedding Veil Length",100]];
let CUSTOM=JSON.parse(localStorage.getItem("unique_custom_items")||"[]");
let ITEMS=[...BASE_ITEMS, ...CUSTOM.map(c=>[c.code,c.name,c.price])];
let CUSTOM_PIC={}; CUSTOM.forEach(c=>{ if(c.pic) CUSTOM_PIC[c.code]=c.pic; });
let GROUP_PIC={"Glasses":"unique-pic1.png","Nail Paint":"unique-pic2.png","Traditional Earring":"unique-pic3.png","Wallet":"unique-pic4.png","Watch":"unique-pic5.png","Bracelet":"unique-pic6.png","Chain":"unique-pic7.png","Brow Cheek":"unique-pic8.png","Wig Cap":"unique-pic9.png","Durag":"unique-pic10.png","Sewing Thread":"unique-pic11.png","Pantyhose":"unique-pic12.png","Zip":"unique-pic13.png","Needle":"unique-pic14.png","Shoe Needle":"unique-pic14.png","Socks":"unique-pic15.png","Head Flower":"unique-pic16.png","Wedding":"unique-pic17.png"};
function emojiOf(n){if(n.includes("Glasses"))return "👓";if(n.includes("Nail"))return "💅";if(n.includes("Earring"))return "💎";if(n.includes("Wallet"))return "👛";if(n.includes("Watch"))return "⌚";if(n.includes("Bracelet"))return "📿";if(n.includes("Chain"))return "🔗";if(n.includes("Durag"))return "🧢";if(n.includes("Thread"))return "🧵";if(n.includes("Pantyhose"))return "🧦";if(n.includes("Zip"))return "🤐";if(n.includes("Needle"))return "🪡";if(n.includes("Socks"))return "🧦";if(n.includes("Flower"))return "🌸";if(n.includes("Wedding"))return "👰";return "✨"}
function picFor(name){let it=ITEMS.find(x=>x[1]===name); if(it && CUSTOM_PIC[it[0]]) return CUSTOM_PIC[it[0]]; return GROUP_PIC[catOf(name)]||""}
function imgTag(name){let p=picFor(name);if(!p)return `<span style="font-size:48px">${emojiOf(name)}</span>`;return `<img src="${p}" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=font-size:48px>${emojiOf(name)}</span>'">`}
let STOCK=JSON.parse(localStorage.getItem("unique_stock")||"null")||{};ITEMS.forEach(i=>{if(STOCK[i[0]]==null)STOCK[i[0]]=50});
let PRICES=JSON.parse(localStorage.getItem("unique_prices")||"null")||{};ITEMS.forEach(i=>{if(PRICES[i[0]]==null)PRICES[i[0]]=i[2]});
let SALES=JSON.parse(localStorage.getItem("unique_sales")||"[]");
let PIN=localStorage.getItem("unique_pin")||"1234";
let DAY_PIN=localStorage.getItem("unique_day_pin")||"9999";
let CLIENT_MODE=localStorage.getItem("unique_client_mode")==="ON";
let STAFF=""; let NEW_PIC_DATA=""; let LAST_VARIANCE_HTML="";
function saveAll(){localStorage.setItem("unique_stock",JSON.stringify(STOCK));localStorage.setItem("unique_prices",JSON.stringify(PRICES));localStorage.setItem("unique_sales",JSON.stringify(SALES));localStorage.setItem("unique_pin",PIN);localStorage.setItem("unique_day_pin",DAY_PIN);localStorage.setItem("unique_custom_items",JSON.stringify(CUSTOM));localStorage.setItem("unique_client_mode",CLIENT_MODE?"ON":"OFF");}
function tripleCheck(title,word){if(!confirm("1/3 - Are you sure? "+title))return false;let t=prompt("2/3 - This will DELETE / CHANGE forever. Type "+word+" to continue:");if(t!==word){alert("Cancelled - you did not type "+word);return false;}if(!confirm("3/3 - LAST WARNING! This cannot be undone. Are you REALLY sure?"))return false;return true;}
function tripleClearSale(){if(!cart.length)return alert("Cart already empty");if(!tripleCheck("Clear this sale? All items in cart will be removed.","CLEAR"))return;cart=[];renderCart();alert("Sale cleared.");}
function toggleClientMode(){CLIENT_MODE=!CLIENT_MODE;saveAll();alert(CLIENT_MODE?"CLIENT MODE ON - Reset hidden, Clear hidden, Triple-check ON. Safe for client.":"DEVELOPER MODE ON - All buttons show for you.");openMgmt();applyClientMode();}
function applyClientMode(){let cb=document.getElementById("clearSaleBtn");if(cb)cb.style.display=CLIENT_MODE?"none":"block";}
function lowStockList(){return ITEMS.filter(i=>STOCK[i[0]]<=5).map(i=>`${i[0]} ${i[1]} - Stock: ${STOCK[i[0]]}`);}
function showLowBanner(){let lows=lowStockList();let b=document.getElementById("lowBanner");if(lows.length){b.style.display="block";b.innerHTML="⚠️ LOW STOCK: "+lows.length+" items low! - "+lows.slice(0,5).join(" | ");}else{b.style.display="none";}}
function doLogin(){let name=document.getElementById("staffName").value.trim();let pin=document.getElementById("loginPin").value.trim();if(!name)return alert("Type Staff Name first");if(pin!==PIN && pin!==DAY_PIN)return alert("Wrong PIN!");STAFF=name;document.getElementById("staffShow").textContent="Cashier: "+STAFF;document.getElementById("cashierShow").textContent=STAFF;document.getElementById("login").style.display="none";let load=document.getElementById("loading");if(load)load.style.display="flex";setTimeout(()=>{if(load)load.style.display="none";showCats();renderCart();showLowBanner();applyClientMode();document.getElementById("scan").focus();},800);}
function logout(){if(confirm("Logout "+STAFF+"?")){document.getElementById("login").style.display="flex";document.getElementById("loginPin").value="";}}
let cart=[],orderNo="UQ-"+Math.floor(10000+Math.random()*89999);document.getElementById("orderNo").textContent=orderNo;
function tick(){document.getElementById("clock").textContent=new Date().toLocaleString("en-ZA")}tick();setInterval(tick,1000);
function catOf(n){if(n.includes("Long Sole"))return "Shoe Sole";if(n.includes("Short Gloves")||n.includes("Long Gloves"))return "Glove";if(n.includes("Back Lace")||n.includes("Lace Reborn"))return "Lace";let groups=["Glasses","Nail Paint","Traditional Earring","Fashion Earring","Wallet","Knob","Watch","Bracelet","Chain","Brow Cheek","Crew Shed","Wig Cap","Durag","Needle","Sewing Thread","Shoe Sole","Heel","Glove","Pantyhose","Zip","Shoe Needle","Machine Oil","Pin","Lace","Reborn","Elastic","Cutting Zip","Ziplock","Cap","Flute","Fish Lane","Beat String","Suspenders","Parton","Partool","Press Stance","Back Lace","Earring Hooks","Chain Holders","Shampoo Cap","Socks","Arm Cover","Head Flower","Wedding"];for(let g of groups)if(n.startsWith(g))return g;return "Other"}
let CATS=[...new Set(ITEMS.map(i=>catOf(i[1])))];
function showCats(){document.getElementById("cats").style.display="grid";document.getElementById("backBtn").style.display="none";document.getElementById("grid").innerHTML="";document.getElementById("cats").innerHTML=CATS.map(c=>{let ex=ITEMS.find(i=>catOf(i[1])===c);let n=ITEMS.filter(i=>catOf(i[1])===c).length;return `<button class="catbtn" onclick="showGroup('${c}')"><div class="cimg">${imgTag(ex[1])}</div>${c}<small>${n} types • Tap to open</small></button>`}).join("");showLowBanner();}
function showGroup(c){document.getElementById("cats").style.display="none";document.getElementById("backBtn").style.display="block";document.getElementById("grid").innerHTML=`<h2 style="grid-column:1/-1;margin:0;color:#006666">${c}</h2>`+ITEMS.filter(i=>catOf(i[1])===c).map(i=>`<div class="card"><div class="pic">${imgTag(i[1])}</div><div class="card-body"><small>${i[0]} • Stock: ${STOCK[i[0]]} ${STOCK[i[0]]<=5?'<span class="low">⚠️ LOW!</span>':''}</small><br><b>${i[1]}</b><br><span class="price">R${PRICES[i[0]]}</span><br><small>Barcode: || ${i[0]} ||</small><button onclick="add('${i[0]}')">ADD +</button></div></div>`).join("")}
function add(code){if(STOCK[code]<=0)return alert("OUT OF STOCK");let it=ITEMS.find(x=>x[0]===code);let f=cart.find(x=>x.code===code);if(f)f.qty++;else cart.push({code,name:it[1],price:PRICES[code],qty:1});renderCart();document.getElementById("scan").value="";document.getElementById("scan").focus()}
function doScan(){let v=document.getElementById("scan").value.trim().toUpperCase();if(!v)return;let it=ITEMS.find(x=>x[0]===v||x[1].toUpperCase()===v);if(!it)return alert("Barcode not found: "+v);add(v)}
function renderCart(){let t=0;document.getElementById("cart").innerHTML=cart.map((s,i)=>{t+=s.price*s.qty;return `<div class="row"><span><b>${s.code}</b> ${s.name}<br>${s.qty} x R${s.price}</span><span>R${s.price*s.qty}<br><button onclick="cart[${i}].qty--;if(cart[${i}].qty<=0)cart.splice(${i},1);renderCart()">-</button> <button onclick="cart[${i}].qty++;renderCart()">+</button> <button onclick="cart.splice(${i},1);renderCart()">✕</button></span></div>`}).join("")||"<p>Scan or tap a group</p>";document.getElementById("total").textContent="R"+t;let given=parseFloat(document.getElementById("cashGiven").value||0);document.getElementById("change").textContent=given>0?"Change: R"+Math.max(0,given-t).toFixed(2):""}
document.getElementById("cashGiven").addEventListener("input",renderCart);
function openDrawer(){alert("CASH DRAWER OPEN - RING!");}
function checkout(){if(!cart.length)return alert("Add item first");let t=cart.reduce((a,s)=>a+s.price*s.qty,0);let method=document.getElementById("payMethod").value;let given=parseFloat(document.getElementById("cashGiven").value||0);let change=Math.max(0,given-t);if(method==="Cash"&&given>0&&given<t)return alert("Cash given less than total");let cust=document.getElementById("cust").value;let note=document.getElementById("extraNote").value;let rows=cart.map(s=>`<div style="display:flex;justify-content:space-between"><span>${s.code} ${s.name} x${s.qty}</span><span>R${s.price*s.qty}</span></div>`).join("");cart.forEach(s=>{STOCK[s.code]-=s.qty});SALES.push({order:orderNo,total:t,method:method,given:given,change:change,cashier:STAFF,date:new Date().toLocaleString("en-ZA"),items:cart.map(s=>s.name+" x"+s.qty).join(", ")});saveAll();let pa=document.getElementById("printArea");pa.innerHTML=`<div style="text-align:center;font-family:monospace"><h2>UNIQUE</h2>Beauty & Fashion<br>Order ${orderNo} • ${STAFF}<br>${new Date().toLocaleString("en-ZA")}<br>${cust?cust+"<br>":""}<hr>${rows}<hr><b>TOTAL R${t}</b><br>Paid: ${method}<br>${given>0?`Cash: R${given.toFixed(2)}<br><b>CHANGE: R${change.toFixed(2)}</b><br>`:""}${note?"Extra: "+note+"<br>":""}<hr><b>THANK YOU! 🇿🇦</b></div>`;pa.style.display="block";setTimeout(()=>{window.print();pa.style.display="none";},200);openDrawer();cart=[];orderNo="UQ-"+Math.floor(10000+Math.random()*89999);document.getElementById("orderNo").textContent=orderNo;document.getElementById("cashGiven").value="";document.getElementById("extraNote").value="";renderCart();showCats();showLowBanner();alert("SALE DONE! Receipt printing - You stay on POS!");}
function closeReceipt(){document.getElementById("receipt").style.display="none";cart=[];orderNo="UQ-"+Math.floor(10000+Math.random()*89999);document.getElementById("orderNo").textContent=orderNo;document.getElementById("cashGiven").value="";document.getElementById("extraNote").value="";renderCart();showCats();showLowBanner();}
function cashUp(){let p=prompt("DAY END PIN:");if(p!==DAY_PIN && p!==PIN)return alert("Wrong DAY END PIN! Default 9999");let today=SALES;let total=today.reduce((a,s)=>a+s.total,0);let cashSales=today.filter(s=>s.method==="Cash");let cardSales=today.filter(s=>s.method.includes("Card")||s.method.includes("EFT"));let mixed=today.filter(s=>s.method==="Card + Cash");let cashExpected=cashSales.reduce((a,s)=>a+s.total,0)+mixed.reduce((a,s)=>a+s.total,0);let cardExpected=cardSales.reduce((a,s)=>a+s.total,0);let changeGiven=today.reduce((a,s)=>a+(s.change||0),0);let cashInDrawer=cashExpected-changeGiven;let html=`<h2>CASH UP + DAY END</h2><p>${new Date().toLocaleString("en-ZA")} • Cashier: ${STAFF}</p><b>SYSTEM SOLD:</b><br>Total Sales: ${today.length}<br>Total: <b>R${total.toFixed(2)}</b><br>Cash (System): R${cashExpected.toFixed(2)}<br>Card / EFT: R${cardExpected.toFixed(2)}<br>Change Given: R${changeGiven.toFixed(2)}<br><b>Cash SHOULD Be In Drawer: R${cashInDrawer.toFixed(2)}</b><hr><input id="cashCounted" type="number" placeholder="Cash counted in hand"><input id="cardCounted" type="number" placeholder="Card on machine (optional)"><button onclick="calcCashUp(${cashInDrawer},${cardExpected})" style="width:100%">CALCULATE - DOES IT MATCH?</button><div id="cashUpResult"></div><hr>${today.map(s=>`<div>${s.date} - ${s.order} - ${s.method} - R${s.total}</div>`).join("")||"No sales yet"}<hr><button onclick="printCashUp()" style="width:100%">🖨️ PRINT CASH UP</button><button onclick="tripleCloseDay()" style="width:100%;background:#c00;color:#fff">CLOSE DAY / NEW DAY - TRIPLE CHECK</button><button onclick="document.getElementById('mgmt').style.display='none'" style="width:100%">Close</button>`;document.getElementById("mgmtPaper").innerHTML=html;document.getElementById("mgmt").style.display="flex"}
function tripleCloseDay(){if(!tripleCheck("Close Day? This clears ALL sales for new day. Print first!","CLOSE"))return;SALES=[];saveAll();alert("Day Closed! New Day Started.");document.getElementById("mgmt").style.display="none";}
function calcCashUp(expectedCash,expectedCard){let counted=parseFloat(document.getElementById("cashCounted").value||0);let diff=counted-expectedCash;let result=diff===0?`<div class="matchbox"><h2>✅ PERFECT MATCH!</h2><p>System: R${expectedCash.toFixed(2)} vs Hand: R${counted.toFixed(2)}<br><b>Difference: R0.00</b></p></div>`:diff<0?`<div class="shortbox"><h2>❌ SHORTAGE!</h2><p>System: R${expectedCash.toFixed(2)} vs Hand: R${counted.toFixed(2)}<br><b>SHORT: R${Math.abs(diff).toFixed(2)} MISSING</b></p></div>`:`<div class="matchbox" style="background:#fff3cd"><h2>⚠️ OVER!</h2><p>System: R${expectedCash.toFixed(2)} vs Hand: R${counted.toFixed(2)}<br><b>OVER: +R${diff.toFixed(2)}</b></p></div>`;document.getElementById("cashUpResult").innerHTML=result;}
function printCashUp(){let pa=document.getElementById("printArea");pa.innerHTML=`<h1 style="text-align:center;color:#006666">UNIQUE 🇿🇦</h1><h2 style="text-align:center">CASH UP + DAY END</h2><p style="text-align:center">${new Date().toLocaleString("en-ZA")} • Cashier: ${STAFF}</p><hr>${document.getElementById("mgmtPaper").innerHTML}<hr><p>Signature: _________________</p>`;pa.style.display="block";setTimeout(()=>{window.print();pa.style.display="none";},200);}
function openMgmt(){let p=prompt("MANAGEMENT PIN:");if(p!==PIN)return alert("Wrong PIN");let rows=ITEMS.map(i=>`<tr><td>${i[0]}</td><td>${i[1]}</td><td><input id="p_${i[0]}" type="number" value="${PRICES[i[0]]}"></td><td><input id="s_${i[0]}" type="number" value="${STOCK[i[0]]}"></td><td><input id="add_${i[0]}" type="number" placeholder="+ Add" style="width:80px"></td><td><input id="count_${i[0]}" type="number" placeholder="Counted" style="width:80px"></td></tr>`).join("");let lows=lowStockList();document.getElementById("mgmtPaper").innerHTML=`<h2>MANAGEMENT</h2><p>Mode: <b>${CLIENT_MODE?"CLIENT MODE ON - Safe for client":"DEVELOPER MODE - Your copy"}</b></p><button onclick="toggleClientMode()" style="width:100%;background:${CLIENT_MODE?"#2e9e2e":"#E8C97A"};color:${CLIENT_MODE?"#fff":"#111"}">${CLIENT_MODE?"Switch to DEVELOPER MODE (Show all buttons)":"Switch to CLIENT MODE (Hide Reset + Clear for client)"}</button><p style="font-size:12px">Turn CLIENT MODE ON before you give POS to client. Turn OFF when you want to fix it.</p><div style="display:flex;gap:6px"><input id="newPin" placeholder="New Management PIN"><button onclick="setPin()">SET MGMT PIN</button></div><div style="display:flex;gap:6px;margin-top:6px"><input id="newDayPin" placeholder="New Day End PIN"><button onclick="setDayPin()">SET DAY END PIN</button></div><p style="font-size:12px;color:red">PINs are hidden in video - do not show them. Give Day End PIN to cashiers only.</p><div class="lowbox"><b>⚠️ LOW STOCK</b><br>${lows.length?lows.join("<br>"):"No low stock ✅"}</div><hr><b>ADD NEW ITEM + PICTURE</b><input id="newCode" placeholder="New Code"><input id="newName" placeholder="New Item Name"><input id="newPrice" type="number" placeholder="Price"><input id="newPic" type="file" accept="image/*" onchange="previewNewPic(this)"><img id="newPicPreview" style="width:90px;height:90px;object-fit:cover;display:none;margin:8px auto"><button onclick="addNewItem()" style="width:100%;background:#2e9e2e;color:#fff">+ ADD NEW ITEM + SAVE</button><hr><b>STOCK + VARIANCE</b><div style="max-height:300px;overflow:auto"><table><tr><th>Code</th><th>Item</th><th>Price</th><th>Stock</th><th>+Add</th><th>Counted</th></tr>${rows}</table></div><button onclick="tripleSaveMgmt()" style="width:100%;background:#006666;color:#fff">SAVE ALL + SHOW VARIANCE - TRIPLE CHECK</button><div id="varianceBox"></div><button onclick="cashUp()" style="width:100%;background:#D4AF37;color:#111">CASH UP + DAY END</button><hr><b style="color:red">FOR NEW CLIENT ONLY - HIDDEN IN CLIENT MODE</b><div id="resetArea" style="display:${CLIENT_MODE?"none":"block"}"><button onclick="tripleReset()" style="width:100%;background:#c00;color:#fff">RESET FOR NEW CLIENT - TRIPLE CHECK</button></div>${CLIENT_MODE?"<p style='color:green;font-weight:900'>✅ Reset is HIDDEN in Client Mode - safe!</p>":""}<button onclick="document.getElementById('mgmt').style.display='none'" style="width:100%">Close</button>`;document.getElementById("mgmt").style.display="flex"}
function previewNewPic(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){NEW_PIC_DATA=e.target.result;let im=document.getElementById("newPicPreview");im.src=NEW_PIC_DATA;im.style.display="block";};r.readAsDataURL(f);}
function setPin(){let np=document.getElementById("newPin").value.trim();if(!np||np.length<4)return alert("PIN must be 4+ digits");if(!tripleCheck("Change Management PIN?","PIN"))return;PIN=np;saveAll();alert("New Management PIN set.");openMgmt()}
function setDayPin(){let np=document.getElementById("newDayPin").value.trim();if(!np||np.length<4)return alert("PIN must be 4+ digits");if(!tripleCheck("Change Day End PIN?","PIN"))return;DAY_PIN=np;saveAll();alert("New Day End PIN set.");}
function tripleSaveMgmt(){if(!tripleCheck("Save All? This will change stock and prices.","SAVE"))return;saveMgmt();}
function saveMgmt(){let varRows=[];let lowRows=[];ITEMS.forEach(i=>{PRICES[i[0]]=parseFloat(document.getElementById("p_"+i[0]).value)||PRICES[i[0]];let addVal=parseInt(document.getElementById("add_"+i[0]).value||0);if(addVal)STOCK[i[0]]+=addVal;let counted=document.getElementById("count_"+i[0]).value;let finalStock=STOCK[i[0]];if(counted!==""){let c=parseInt(counted);let variance=c-STOCK[i[0]];if(variance!==0)varRows.push(`<div>${i[0]} ${i[1]} - System: ${STOCK[i[0]]} - Counted: ${c} - <b>VARIANCE: ${variance}</b></div>`);finalStock=c;}if(finalStock<=5)lowRows.push(`<div>${i[0]} ${i[1]} - Stock: ${finalStock} - LOW!</div>`);});saveAll();let report=`<hr><h2>VARIANCE + LOW STOCK</h2><p>${new Date().toLocaleString("en-ZA")} • ${STAFF}</p><div class="lowbox">${lowRows.length?lowRows.join(""):"No low stock ✅"}</div><h3>VARIANCE</h3>${varRows.length?varRows.join(""):"No variance ✅"}<br><button onclick="printVariance()" style="width:100%">🖨️ PRINT VARIANCE</button>`;document.getElementById("varianceBox").innerHTML=report;LAST_VARIANCE_HTML=report;alert("Saved! Variance showing.");showCats();showLowBanner();}
function printVariance(){let pa=document.getElementById("printArea");pa.innerHTML=`<h1 style="text-align:center">UNIQUE 🇿🇦</h1><h2 style="text-align:center">VARIANCE + LOW STOCK</h2><hr>${LAST_VARIANCE_HTML}`;pa.style.display="block";setTimeout(()=>{window.print();pa.style.display="none";},200);}
function addNewItem(){let c=document.getElementById("newCode").value.trim().toUpperCase(),n=document.getElementById("newName").value.trim(),p=parseFloat(document.getElementById("newPrice").value);if(!c||!n||!p)return alert("Fill Code, Name, Price");if(ITEMS.find(x=>x[0]===c))return alert("Code exists");CUSTOM.push({code:c,name:n,price:p,pic:NEW_PIC_DATA||""});if(NEW_PIC_DATA) CUSTOM_PIC[c]=NEW_PIC_DATA;ITEMS.push([c,n,p]);PRICES[c]=p;STOCK[c]=50;CATS=[...new Set(ITEMS.map(i=>catOf(i[1])))];saveAll();NEW_PIC_DATA="";alert("Added "+c);openMgmt();showCats();}
function tripleReset(){if(!tripleCheck("RESET FOR NEW CLIENT? This will DELETE all Sales, Items, Pictures, Stock, Prices.","RESET"))return;let p2=prompt("Type RESET again to confirm:");if(p2!=="RESET")return alert("Cancelled");localStorage.removeItem("unique_stock");localStorage.removeItem("unique_prices");localStorage.removeItem("unique_sales");localStorage.removeItem("unique_custom_items");localStorage.removeItem("unique_pin");localStorage.removeItem("unique_day_pin");localStorage.removeItem("unique_client_mode");alert("Cleared! Reloading clean.");location.reload();}
showCats();renderCart();showLowBanner();applyClientMode();
</script></body></html>
